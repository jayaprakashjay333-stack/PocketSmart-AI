{% extends "base.html" %}
{% block title %}Login | PocketSmart AI{% endblock %}
{% block content %}
<section class="auth-wrap container">
    <div class="auth-card card">
        <h2>Login</h2>
        <form method="post" action="/login">
            <label>Email</label>
            <input type="email" name="email" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <button class="btn btn-primary" type="submit">Login</button>
        </form>
        <p class="small-note">Demo user: demo@pocketsmart.ai / demo12345</p>
        <p class="small-note">Need an account? <a href="/register">Register here</a></p>
    </div>
</section>
{% endblock %}
